# SecureVault — NGINX Configuration
# TLS 1.3 only, HSTS preload, strict CSP, security headers
# Reference: docs/architecture/SECURE-DESIGN-DOCUMENT.md Section 7

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Security: hide nginx version
server_tokens off;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────────────
    # LOGGING
    # ─────────────────────────────────────────────
    log_format json_access escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_time":"$request_time",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
        '}';

    access_log /var/log/nginx/access.log json_access;

    # ─────────────────────────────────────────────
    # PERFORMANCE & SECURITY
    # ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # Size limits (prevent DoS via large requests)
    client_max_body_size 52m;       # Slightly above 50MB to allow multipart overhead
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    large_client_header_buffers 4 16k;

    # ─────────────────────────────────────────────
    # RATE LIMITING ZONES (Redis-backed via limit_req_zone)
    # ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=global:20m rate=200r/m;

    limit_req_status 429;

    # ─────────────────────────────────────────────
    # SSL/TLS GLOBAL SETTINGS
    # ─────────────────────────────────────────────
    ssl_protocols TLSv1.3;              # TLS 1.0/1.1/1.2 DISABLED
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;      # Client chooses from server's list (TLS 1.3)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;            # Disable for forward secrecy
    ssl_stapling on;                    # OCSP stapling
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────
    # GZIP (only for non-sensitive content types)
    # ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    # NOTE: Never gzip API responses with sensitive data (set in location blocks)

    # ─────────────────────────────────────────────
    # HTTP → HTTPS REDIRECT
    # ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─────────────────────────────────────────────
    # MAIN HTTPS SERVER
    # ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name securevault.io www.securevault.io;

        ssl_certificate     /etc/ssl/certs/securevault.crt;
        ssl_certificate_key /etc/ssl/certs/securevault.key;
        ssl_trusted_certificate /etc/ssl/certs/ca-chain.crt;

        # ─────────────────────────────────────────────
        # SECURITY HEADERS
        # ─────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # CSP is set per-location (nonce required) — see Django middleware

        # Remove server identification
        more_clear_headers Server;
        more_clear_headers X-Powered-By;

        # ─────────────────────────────────────────────
        # API ROUTES — Django Backend
        # ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;

            # Security: don't cache API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            proxy_cache off;

            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Hide upstream headers
            proxy_hide_header X-Powered-By;
        }

        # Stricter rate limit for login endpoint
        location /api/v1/auth/login/ {
            limit_req zone=login burst=3 nodelay;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Upload endpoint rate limiting
        location /api/v1/files/upload/ {
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 52m;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_request_buffering off;  # Stream large uploads directly
            proxy_read_timeout 120s;
        }

        # Admin panel — additional restrictions
        location /api/v1/admin/ {
            limit_req zone=login burst=5 nodelay;

            # Only allow from internal networks (example)
            # allow 10.0.0.0/8;
            # deny all;

            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Django admin interface
        location /django-admin/ {
            # Restrict to internal networks only
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ─────────────────────────────────────────────
        # STATIC FILES (Django collectstatic)
        # ─────────────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ─────────────────────────────────────────────
        # FRONTEND — React SPA
        # ─────────────────────────────────────────────
        location / {
            limit_req zone=global burst=50 nodelay;
            root /app/frontend/build;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # ─────────────────────────────────────────────
        # HEALTH CHECK (unauthenticated)
        # ─────────────────────────────────────────────
        location /health/ {
            proxy_pass http://backend:8000;
            access_log off;
        }

        # ─────────────────────────────────────────────
        # BLOCK COMMON ATTACK PATTERNS
        # ─────────────────────────────────────────────
        # Block access to sensitive files
        location ~* \.(git|env|log|bak|sql|conf|key|pem)$ {
            deny all;
            return 404;
        }

        # Block path traversal attempts
        if ($request_uri ~* "\.\./") {
            return 400;
        }

        # Block scanner signatures in user-agent
        if ($http_user_agent ~* "(sqlmap|nikto|nmap|masscan|zgrab|python-requests|curl)") {
            # Note: Only block in production, comment out for pentest environments
            # return 403;
        }

        # ─────────────────────────────────────────────
        # ERROR PAGES (generic, no version disclosure)
        # ─────────────────────────────────────────────
        error_page 400 /error/400.html;
        error_page 401 /error/401.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 429 /error/429.html;
        error_page 500 502 503 504 /error/500.html;

        location /error/ {
            root /app/frontend/build;
            internal;
        }
    }
}
